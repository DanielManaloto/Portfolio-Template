<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <!-- Section: backend -->
  <rect x="24" y="24" width="560" height="500" rx="14" fill="#f5f8fb" stroke="#c9d6e3" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="44" y="54" font-size="15" font-weight="700" fill="#2c5282">C ENGINE  (backend)</text>

  <!-- Section: frontend -->
  <rect x="608" y="24" width="368" height="500" rx="14" fill="#fbf7f5" stroke="#e3d0c9" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="628" y="54" font-size="15" font-weight="700" fill="#9c4221">C++ / DEAR IMGUI  (frontend)</text>

  <!-- Box template function via repeated rects -->
  <!-- 1. NIC -->
  <rect x="60" y="80" width="220" height="56" rx="8" fill="#2c5282"/>
  <text x="170" y="113" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Network Interface</text>

  <!-- 2. libpcap -->
  <rect x="60" y="166" width="220" height="56" rx="8" fill="#2b6cb0"/>
  <text x="170" y="194" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">libpcap / Npcap</text>
  <text x="170" y="210" font-size="11" fill="#dbe9fb" text-anchor="middle">tls_engine_start()  ·  pcap_loop()</text>

  <!-- 3. tls_handler demux -->
  <rect x="60" y="252" width="220" height="64" rx="8" fill="#3182ce"/>
  <text x="170" y="279" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">tls_handler()</text>
  <text x="170" y="295" font-size="11" fill="#e3f0fc" text-anchor="middle">Ethernet / VLAN / IPv4 / TCP</text>
  <text x="170" y="309" font-size="11" fill="#e3f0fc" text-anchor="middle">demux  (tls_capture.c)</text>

  <!-- 4. Session table -->
  <rect x="60" y="346" width="220" height="64" rx="8" fill="#3182ce"/>
  <text x="170" y="373" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Session Table</text>
  <text x="170" y="389" font-size="11" fill="#e3f0fc" text-anchor="middle">per-flow TCP reassembly</text>
  <text x="170" y="403" font-size="11" fill="#e3f0fc" text-anchor="middle">(tls_session.h)</text>

  <!-- 5. Record parser -->
  <rect x="60" y="440" width="220" height="56" rx="8" fill="#2c5282"/>
  <text x="170" y="465" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">TLS Record Drain</text>
  <text x="170" y="481" font-size="11" fill="#dbe9fb" text-anchor="middle">session_drain()  →  one record at a time</text>

  <!-- Right column inside backend: callbacks -->
  <rect x="340" y="200" width="220" height="60" rx="8" fill="#38a169"/>
  <text x="450" y="225" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">tls_record_cb</text>
  <text x="450" y="241" font-size="11" fill="#e3fbe9" text-anchor="middle">fires once per parsed record</text>

  <rect x="340" y="386" width="220" height="60" rx="8" fill="#38a169"/>
  <text x="450" y="411" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">tls_stream_cb</text>
  <text x="450" y="427" font-size="11" fill="#e3fbe9" text-anchor="middle">fires on session teardown (FIN×2 / RST)</text>

  <!-- Frontend boxes -->
  <rect x="644" y="130" width="296" height="60" rx="8" fill="#c05621"/>
  <text x="792" y="155" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Session.cpp</text>
  <text x="792" y="171" font-size="11" fill="#fde7d6" text-anchor="middle">on_record() / on_stream() → thread-safe stores</text>

  <rect x="644" y="222" width="296" height="60" rx="8" fill="#dd6b20"/>
  <text x="792" y="247" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Parser.cpp</text>
  <text x="792" y="263" font-size="11" fill="#fdeee0" text-anchor="middle">record/handshake parsing · X.509 cert extraction</text>

  <rect x="644" y="314" width="296" height="90" rx="8" fill="#9c4221"/>
  <text x="792" y="339" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Panels.cpp / PanelDetails.cpp</text>
  <text x="792" y="357" font-size="11" fill="#fbe4d8" text-anchor="middle">Records · Streams · Certificates</text>
  <text x="792" y="372" font-size="11" fill="#fbe4d8" text-anchor="middle">Servers · Statistics</text>
  <text x="792" y="387" font-size="11" fill="#fbe4d8" text-anchor="middle">(Dear ImGui, rendered every frame)</text>

  <rect x="700" y="440" width="184" height="50" rx="8" fill="#742a2a"/>
  <text x="792" y="470" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">You, learning TLS 🎓</text>

  <!-- Arrows: main vertical pipeline -->
  <path d="M170,136 L170,166" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M170,222 L170,252" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M170,316 L170,346" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M170,410 L170,440" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: branch to callbacks -->
  <path d="M280,284 L340,230" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M280,468 L340,416" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: callbacks to frontend -->
  <path d="M560,225 C610,205 610,175 644,163" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M560,411 C610,400 610,265 644,255" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: frontend internal -->
  <path d="M792,190 L792,222" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M792,282 L792,314" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M792,404 L792,440" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Caption -->
  <text x="500" y="580" font-size="12" fill="#718096" text-anchor="middle">
    Raw packets in → parsed TLS metadata out. Payload bytes of ApplicationData records are never decrypted or inspected.
  </text>
  <text x="500" y="600" font-size="12" fill="#a0aec0" text-anchor="middle">
    fig. 1 — high-level data flow through the capture engine and the ImGui frontend
  </text>
</svg>
